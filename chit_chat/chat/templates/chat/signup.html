{% extends 'chat/base.html' %}
{% block title %}
Login Page
{% endblock %}

{% block main %}

<div class="container">

	<div class="card">
		<p class="title">Signing up Form</p>

		<form>
			<div class="field">
				<label>Name</label>
				<input type="text" placeholder="Your name">
			</div>

			<div class="field">
				<label>Password</label>
				<input type="text" placeholder="Your password">
			</div>

			<button class="btn btn-primary" type="submit">Submit</button>
		</form>
	</div>

</div>

{% endblock %}
