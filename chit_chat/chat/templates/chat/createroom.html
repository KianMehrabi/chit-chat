{% extends 'chat/base.html' %}

{% block title %}
Create Room Page
{% endblock%}
{% block main %}
<form method="post">
	{% csrf_token %}

	<div class="field">
		<label for="{{ form.title.id_for_label }}">Title</label>
		{{ form.title }}
		{{ form.title.error }}
	</div>

	<div class="field">
		<label for="{{ form.description.id_for_label }}">Description</label>
		{{ form.description }}
	</div>

	<button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
