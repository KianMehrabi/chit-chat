<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Homepage</title>
	<style>
		:root {
			--bg: #0f172a;
			--surface: #1e293b;
			--accent: #38bdf8;
			--text: #f1f5f9;
			--muted: #94a3b8;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background: var(--bg);
			color: var(--text);
		}

		header {
			padding: 1.5rem 2rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
		}

		header h1 {
			font-size: 1.25rem;
			font-weight: 600;
			letter-spacing: 0.02em;
		}

		header h1 span {
			color: var(--accent);
		}

		main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 2rem;
		}

		.hero h2 {
			font-size: clamp(2.5rem, 6vw, 4.5rem);
			font-weight: 700;
			background: linear-gradient(135deg, var(--text), var(--accent));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.hero p {
			margin-top: 0.75rem;
			color: var(--muted);
			font-size: 1.1rem;
		}
	</style>
</head>

<body>

	<header>
		<h1>My<span>ChitChat</span></h1>
	</header>

	<main>
		<div class="hero">
			<h2>Hello, World</h2>
			<p>A minimal start to something bigger.</p>
		</div>
	</main>

</body>

</html>
