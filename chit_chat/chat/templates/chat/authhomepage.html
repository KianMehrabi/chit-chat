{% extends 'chat/base.html' %}

{% block title %}
Home page
{% endblock%}

{% block main %}

<div class="container">
	<div class="card">
		<p class="title">{{ user.username }}</p>

		<span class="badge badge-success">Authenticated</span>
	</div>

	<div class="card">
		<div id="message">
		</div>
		<p class="title">Logout</p>
		<button onclick="requestLogOut()" class="btn btn-primary">Click</button>
	</div>
</div>


<script>
	async function requestLogOut() {
		try {
			const response = await fetch("{% url 'logoutApi' %}");

			if (!response.ok) {
				throw new Error(`HTTP error: ${response.status}`);
			}

			const message = document.getElementById("message");

			message.innerHTML =
				"<span class='badge badge-success badge-shake'>success</span>";

			setTimeout(() => {
				window.location.href = "{% url 'homepage' %}";
			}, 1000);

		} catch (error) {
			console.error(error.message);
		}
	}
</script>
{% endblock %}
